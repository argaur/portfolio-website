<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found: Gaurav Gupta</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0e0e12;--surface:#16161e;--border:#2a2a38;--text:#ece8e2;--muted:#9896a0;--accent:#c9a84c;}
    *{box-sizing:border-box;margin:0;padding:0;border-radius:0;}
    body{min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
      background-image:linear-gradient(rgba(42,42,56,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(42,42,56,.35) 1px,transparent 1px);background-size:40px 40px;}
    main{width:100%;max-width:640px;margin:0 auto;padding:48px 16px;}
    .label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:24px;}
    h1{font-family:'Space Mono',monospace;font-size:clamp(28px,7vw,44px);line-height:1.1;margin-bottom:16px;}
    p{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:32px;max-width:48ch;}
    .links{display:flex;flex-wrap:wrap;gap:8px;}
    a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--text);border:1px solid var(--border);background:var(--surface);}
    a:hover{border-color:var(--accent);color:var(--accent);}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
    a.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    a.primary:hover{color:var(--bg);}
  </style>
</head>
<body>
  <main>
    <p class="label">404 / Not found</p>
    <h1>This page does not exist.</h1>
    <p>The link may be old, or the page has moved. The projects and case studies are all reachable from the main site.</p>
    <div class="links">
      <a class="primary" href="/">Home</a>
      <a href="/#projects">Projects</a>
      <a href="/#contact">Contact</a>
    </div>
  </main>
</body>
</html>
